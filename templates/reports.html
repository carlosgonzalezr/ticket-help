{% extends "base.html" %}
{% block title %}Reportes — Ticket Help{% endblock %}
{% block page_title %}Reportes{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">Reportes</h1>
  <p class="page-subtitle">Estadísticas de tu grupo.</p>
</div>

<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
  <div class="card">
    <div class="card-body" style="text-align:center;padding:32px 20px">
      <div style="font-size:40px;margin-bottom:8px">📊</div>
      <p style="color:var(--text-muted);font-size:13px">Reportes avanzados próximamente.</p>
    </div>
  </div>
</div>
{% endblock %}
